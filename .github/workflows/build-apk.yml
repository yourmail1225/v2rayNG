name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Download Prebuilt Core AAR
        run: |
          mkdir -p V2rayNG/app/libs
          # Download latest official AndroidLibXrayLite release aar
          curl -L -o V2rayNG/app/libs/AndroidLibXrayLite.aar https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/AndroidLibXrayLite.aar || true
          # Also check submodule build outputs
          if [ -d "AndroidLibXrayLite" ]; then
            mkdir -p AndroidLibXrayLite/build/outputs/aar
            cp -f V2rayNG/app/libs/AndroidLibXrayLite.aar AndroidLibXrayLite/build/outputs/aar/AndroidLibXrayLite-release.aar || true
            cp -f V2rayNG/app/libs/AndroidLibXrayLite.aar AndroidLibXrayLite/build/outputs/aar/AndroidLibXrayLite-debug.aar || true
          fi

      - name: Build Debug APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-OpenVPN-Debug-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
