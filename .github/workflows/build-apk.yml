name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install GoMobile and Build Xray Core AAR
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          
          # Build AndroidLibXrayLite if it exists as submodule
          if [ -d "AndroidLibXrayLite" ]; then
            cd AndroidLibXrayLite
            if [ -f "build.sh" ]; then
              chmod +x build.sh
              ./build.sh || true
            elif [ -f "gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleRelease || true
            fi
            cd ..
          fi

      - name: Build Tun Module
        run: |
          if [ -f "compile-hevtun.sh" ]; then
            chmod +x compile-hevtun.sh
            ./compile-hevtun.sh || true
          fi

      - name: Compile and Build Debug APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          # First check if there is an artifact preparation task
          ./gradlew tasks --all | grep -i "artifact\|xray\|lib" || true
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-OpenVPN-Debug-APK
          path: V2rayNG/app/build/outputs/apk/debug/*.apk
