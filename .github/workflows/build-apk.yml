name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Build Submodule Core and Tun
        run: |
          chmod +x compile-hevtun.sh || true
          ./compile-hevtun.sh || true

      - name: Build All Modules with Gradle
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          # Build all library subprojects first so libv2ray classes are generated
          ./gradlew assembleFdroidDebug --no-daemon -x test --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-OpenVPN-Debug-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
